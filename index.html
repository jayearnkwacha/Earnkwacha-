<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarnKwaCha 💰</title>
<style>
:root { --bg: #f4f4f4; --card: white; --text: #000; --border: #ddd; }
body.dark { --bg: #121212; --card: #1e1e1e; --text: #fff; --border: #333; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
body { background: var(--bg); color: var(--text); padding: 20px; transition: 0.3s; }
.container { max-width: 700px; margin: auto; background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
h1 { text-align: center; color: #007bff; }
.btn { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
.btn-green { background: #28a745; }.btn-blue { background: #007bff; }.btn-orange { background: #FF9800; }
.btn-red { background: red; }.btn-purple { background: #6f42c1; }.btn-yellow { background: #ffc107; color: black; }
.balance-box { text-align: center; margin: 20px 0; padding: 20px; background: #e8f5e9; border-radius: 10px; }
.balance { font-size: 36px; color: green; font-weight: bold; }
.task { background: var(--bg); padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #007bff; display: flex; justify-content: space-between; }
.ref-box { background: #e7f3ff; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: center; border: 2px dashed #007bff; }
#dashboard, #adminPanel, #tasksSection, #withdrawModal, #proofModal, #adminPassModal { display: none; }
.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; display: flex; align-items: center; justify-content: center; }
.modal-content { background: var(--card); padding: 20px; width: 90%; max-width: 400px; border-radius: 10px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
th { background: #007bff; color: white; padding: 10px; }
td { padding: 10px; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>

<div class="notification" id="notification" style="position:fixed;top:20px;right:20px;background:#28a745;color:white;padding:15px;display:none;z-index:1000;"></div>

<div class="container" id="auth">
<h1>EarnKwaCha 💰</h1>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button class="btn btn-green" onclick="signUp()">Sign Up +50 Points</button>
<button class="btn btn-blue" onclick="login()">Login</button>
</div>

<div class="container" id="dashboard">
<h2>Dashboard</h2><p id="welcome">Loading...</p>
<div class="balance-box"><p>Your Balance</p><div class="balance" id="points">0 Points</div></div>
<div class="ref-box"><h4>💰 Referral: L1=10pts | L2=5pts After 1 Ad - Max 20</h4><input type="text" id="refLink" readonly><button class="btn btn-green" onclick="copyRef()">Copy Link</button></div>
<button class="btn btn-orange" onclick="openWithdraw()">Withdraw</button>
<button class="btn btn-green" onclick="showTasks()">View Tasks</button>
<button class="btn btn-purple" id="adminBtn" onclick="showAdmin()" style="display:none;">Admin</button>
<button class="btn btn-red" onclick="logout()">Logout</button>

<div id="tasksSection">
<h3>Daily Tasks</h3>
<div class="task"><b>Watch Ads - 8 Points</b><button id="adsBtn" onclick="addTaskPoints('ads', 8)">Watch</button></div>
</div>

<div id="withdrawModal" class="modal"><div class="modal-content"><h3>Request Withdraw</h3><p>Min: 5000 Points</p><input id="withdrawAmount" type="number" placeholder="Points"><button class="btn btn-green" onclick="requestWithdraw()">Submit</button><button class="btn btn-red" onclick="closeWithdraw()">Cancel</button></div></div>
</div>

<div class="container" id="adminPanel"><h1>Admin 🔐</h1><table id="usersTable"><thead><tr><th>Email</th><th>Points</th><th>L2 Status</th></tr></thead><tbody></tbody></table><button class="btn btn-blue" onclick="hideAdmin()">Back</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUzpLPaWrT2SC7ncLZyGVRM88YfX_iJF4",
  authDomain: "earnkwacha-b385a.firebaseapp.com",
  projectId: "earnkwacha-b385a"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ADMIN_EMAIL = "kellybkenani@gmail.com";
const L2_LIMIT = 20;
let currentUserData = {};
let dailyLimits = {ads: 0};function showNotif(msg){ const n = document.getElementById('notification'); n.innerText = msg; n.style.display = 'block'; setTimeout(()=> n.style.display='none', 3000); }

window.copyRef = () => { const link = `${window.location.origin}${window.location.pathname}?ref=${auth.currentUser.uid}`; document.getElementById('refLink').value = link; navigator.clipboard.writeText(link); showNotif("Copied!"); }

window.signUp = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const refId = new URLSearchParams(window.location.search).get('ref');
  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    let referredBy = ""; let referredByL2 = "";
    if(refId){
      const refDoc = await getDoc(doc(db, "users", refId));
      if(refDoc.exists()){
        referredBy = refId;
        referredByL2 = refDoc.data().referredBy || "";
        await updateDoc(doc(db, "users", refId), { points: increment(10) });
      }
    }
    await setDoc(doc(db, "users", userCredential.user.uid), { email: email, points: 50, referredBy: referredBy, referredByL2: referredByL2, l2Paid: false, l2ReferralCount: 0 });
    showNotif("Account created! +50 Points");
  } catch (error) { showNotif(error.message); }
}

window.addTaskPoints = async (type, pts) => {
  const user = auth.currentUser;
  const userDocRef = doc(db, "users", user.uid);
  const data = (await getDoc(userDocRef)).data();

  await updateDoc(userDocRef, { points: increment(pts) });
  dailyLimits[type]++;
  showNotif(`+${pts} Points added!`);

  if(type === 'ads' && dailyLimits.ads === 1 && data.referredByL2 &&!data.l2Paid){
    const l2DocRef = doc(db, "users", data.referredByL2);
    const l2Data = (await getDoc(l2DocRef)).data();
    if((l2Data.l2ReferralCount || 0) < L2_LIMIT){
      await updateDoc(l2DocRef, { points: increment(5), l2ReferralCount: increment(1) });
      await updateDoc(userDocRef, { l2Paid: true });
    }
  }
}

window.login = async () => { const email = document.getElementById("email").value; const password = document.getElementById("password").value; try { await signInWithEmailAndPassword(auth, email, password); } catch (error) { showNotif(error.message); } }
window.logout = () => { signOut(auth); }
window.showTasks = () => { document.getElementById("tasksSection").style.display = "block"; }
window.openWithdraw = () => { document.getElementById('withdrawModal').style.display = 'flex'; }
window.closeWithdraw = () => { document.getElementById('withdrawModal').style.display = 'none'; }
window.requestWithdraw = async () => { const amount = parseInt(document.getElementById("withdrawAmount").value); if (amount > currentUserData.points) return showNotif("Not enough points"); await updateDoc(doc(db, "users", auth.currentUser.uid), { points: increment(-amount) }); showNotif("Withdraw requested"); closeWithdraw(); }
window.showAdmin = async () => { document.getElementById('dashboard').style.display = 'none'; document.getElementById('adminPanel').style.display = 'block'; loadAllUsers(); }
window.hideAdmin = () => { document.getElementById('adminPanel').style.display = 'none'; document.getElementById('dashboard').style.display = 'block'; }
async function loadAllUsers(){ const querySnapshot = await getDocs(collection(db, "users")); let html = ""; querySnapshot.forEach((docSnap) => { const data = docSnap.data(); html += `<tr><td>${data.email}</td><td>${data.points || 0}</td><td>${data.l2Paid? 'Paid' : 'Pending'}</td></tr>`; }); document.querySelector("#usersTable tbody").innerHTML = html; }

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('auth').style.display = 'none'; document.getElementById('dashboard').style.display = 'block';
    onSnapshot(doc(db, "users", user.uid), (docSnap) => { if(docSnap.exists()){ currentUserData = docSnap.data(); document.getElementById("welcome").innerText = `Welcome, ${currentUserData.email}`; document.getElementById("points").innerText = `${currentUserData.points || 0} Points`; } });
    if(user.email === ADMIN_EMAIL){ document.getElementById('adminBtn').style.display = 'block'; }
  } else {
    document.getElementById('auth').style.display = 'block'; document.getElementById('dashboard').style.display = 'none'; document.getElementById('adminPanel').style.display = 'none';
  }
});
</script>
</body>
</html>
