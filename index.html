<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style> /* same css as before */ </style>
</head>
<body>
<div class="notification" id="notification"></div>
<div id="loginPage" class="page active">
  <div class="container box">
    <h1>EarnKwaCha DEBUG ðŸ’°</h1>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button class="btn btn-green" onclick="signUp()">Sign Up +50 Points</button>
  </div>
</div>

<script type="module">
alert("JS Loaded âœ…"); // TEST 1

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUzpLPaWrT2SC7ncLZyGVRM88YfX_iJF4",
  authDomain: "earnkwacha-b385a.firebaseapp.com",
  projectId: "earnkwacha-b385a",
  storageBucket: "earnkwacha-b385a.firebasestorage.app",
  messagingSenderId: "5188195546",
  appId: "1:5188195546:web:de9200ec1217bc8f9441e3"
};

try {
  const app = initializeApp(firebaseConfig);
  alert("Firebase Init âœ…"); // TEST 2
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.signUp = async function() {
    alert("Button Clicked âœ…"); // TEST 3
    const email = document.getElementById("email").value; 
    const password = document.getElementById("password").value;
    alert("Email: " + email); // TEST 4
    
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password); 
      alert("Auth Created âœ… UID: " + userCredential.user.uid); // TEST 5
      
      await setDoc(doc(db, "users", userCredential.user.uid), { 
        email: email, 
        balance: 50, 
        createdAt: new Date() 
      });
      alert("Firestore Saved âœ… +50 Points"); // TEST 6
    } catch (error) { 
      alert("ERROR: " + error.message); // THIS WILL CATCH IT
      console.error(error);
    }
  }
} catch(e) {
  alert("FATAL ERROR: " + e.message);
}
</script>
</body>
</html>
